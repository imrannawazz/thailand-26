<!-- Direction contract (the map world, accepted by Imran 2026-10-24)
THESIS: the trip is a place, so the planner is the place: a satellite 3D map of Phuket, Phi Phi and Krabi is the surface, and every page is glass laid over it. It refuses the category default of a list app with a map tab.
OWN-WORLD: satellite imagery on Copernicus terrain under a warm sky; dark glass panels (rgba 12,20,27 at 84%, 22px blur); Jost; white ink, one amber (#ffb703) for figures, picks, the live tab and locks; sky-blue (#8fd3f4) for links; green (#8ee0a1) and coral (#ff9a7a) only as verdicts (available or not, tier A or Z), because the product's job is deciding; pins are white dots, picks glow amber; legs are 3D paths with a travelling light.
STORY: five friends open it on a phone in the sun, see where they are and where tonight is, open a day, decide and lock, and the map flies with them.
FIRST VIEWPORT: the island from the air, tilted 42 degrees, the day's three highlights lower left in white over a dark gradient, the date rail along the bottom; header pills at the top; Map menu holds every switch.
FORM: the live app's three-level shell (overview, day page, card) kept whole; user-pinned world (satellite 3D, dark glass), no roll.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
